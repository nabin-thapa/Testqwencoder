<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nabin Thapa | Developer & BCA Student</title>
    <meta name="description" content="Portfolio of Nabin Thapa, a BCA developer from Nepal building web applications, mobile apps, AI-powered tools, and software projects." />
    <meta name="author" content="Nabin Thapa" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nabin Thapa | Developer & BCA Student" />
    <meta property="og:description" content="Portfolio of Nabin Thapa, a BCA developer from Nepal building web applications, mobile apps, AI-powered tools, and software projects." />
    <meta property="og:site_name" content="Nabin Thapa Portfolio" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nabin Thapa | Developer & BCA Student" />
    <meta name="twitter:description" content="Portfolio of Nabin Thapa, a BCA developer from Nepal building web applications, mobile apps, AI-powered tools, and software projects." />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://nabinthapa.com" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <!-- Theme initialization -->
    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    
    <style>
      html, body { margin: 0; padding: 0; }
      html.dark { background-color: #0a0a0f; color: #f0f0f5; }
      html.light { background-color: #ffffff; color: #1a1a2e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
